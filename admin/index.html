<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin sign in - anoshvi.uk</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body class="admin-page">
  <header class="admin-header">
    <a class="logo" href="../index.html">anoshvi<span class="tld">.uk</span></a>
  </header>

  <main class="admin-main">
    <section class="admin-login" aria-labelledby="admin-title">
      <p class="admin-kicker">Restricted access</p>
      <h1 id="admin-title">Admin sign in</h1>
      <p class="admin-intro">Enter your administrator credentials to continue.</p>

      <form id="admin-form">
        <div class="field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn block" type="submit">Sign in</button>
      </form>

      <p class="admin-note" id="admin-status">Authentication is not configured yet.</p>
    </section>
  </main>
  <script>
    document.getElementById("admin-form").addEventListener("submit", function (event) {
      event.preventDefault();
      document.getElementById("admin-status").textContent = "Admin authentication is not enabled yet.";
    });
  </script>
</body>
</html>

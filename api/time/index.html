<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Time API — anoshvi.uk</title>
  <meta name="robots" content="noindex" />
  <style>
    body { margin: 0; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
           background: #0b1020; color: #e8ecf6; display: grid; min-height: 100vh; place-items: center; }
    .wrap { width: min(680px, 92vw); }
    h1 { font-size: 16px; color: #59d3c4; letter-spacing: 1px; text-transform: uppercase; margin: 0 0 12px; }
    pre { background: #151d38; border: 1px solid #24304f; border-radius: 12px; padding: 20px;
          font-size: 15px; line-height: 1.7; overflow: auto; margin: 0; }
    .k { color: #6c8cff; } .s { color: #59d3c4; } .n { color: #e0b0ff; }
    p.note { color: #9aa6c4; font-size: 13px; margin-top: 14px; }
    a { color: #6c8cff; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>GET /api/time</h1>
    <pre id="out">loading…</pre>
    <p class="note">
      Static (GitHub Pages) endpoint — the timestamp is computed client-side in your browser and refreshes every second.
      For a true server-computed response, use the Cloudflare Worker version. <a href="/">← back to site</a>
    </p>
  </div>

  <script>
    function payload() {
      const now = new Date();
      return {
        service: "anoshvi.uk time api",
        source: "client-side (github pages / static)",
        iso_8601: now.toISOString(),
        unix_ms: now.getTime(),
        unix_s: Math.floor(now.getTime() / 1000),
        utc: now.toUTCString(),
        local: now.toString(),
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        offset_minutes: -now.getTimezoneOffset()
      };
    }

    function render() {
      const data = payload();
      const json = JSON.stringify(data, null, 2)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/"([^"]+)":/g, '<span class="k">"$1"</span>:')
        .replace(/: "([^"]*)"/g, ': <span class="s">"$1"</span>')
        .replace(/: (\d+)(,?)$/gm, ': <span class="n">$1</span>$2');
      document.getElementById("out").innerHTML = json;
    }

    render();
    setInterval(render, 1000);
  </script>
</body>
</html>
